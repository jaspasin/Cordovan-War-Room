<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cordovan Gosling Rd — Launch Marketing Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wall:#E9E7DE; --canvas:#FFFFFF; --ink:#231E2E; --body:#4C4756;
    --muted:#8B8598; --line:#DBD8CE;
    --p1:#2F45C5; --p2:#DA3E1E; --p3:#6A3AA8; --p4:#E39A11; --p5:#B4237B; --p6:#12876C;
    --ok:#12876C; --go:#2F45C5; --wait:#8B8598; --call:#C9761A;
    --maxw:1040px;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0; background:var(--wall); color:var(--body);
    font-family:"Figtree",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-size:16px; line-height:1.55; letter-spacing:-0.005em;}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:clamp(18px,4vw,44px);}

  .placard{background:var(--canvas); border:1px solid var(--line); border-radius:4px;
    padding:clamp(22px,4vw,40px);}
  .backlink{display:inline-block; font-size:.85rem; font-weight:600; color:var(--muted); text-decoration:none; margin-bottom:16px;}
  .backlink:hover{color:var(--ink);}
  .head-grid{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:24px;}
  .stamp{display:inline-block; font-size:.8rem; font-weight:600; color:var(--muted);
    border:1px solid var(--line); border-radius:100px; padding:5px 14px; margin-bottom:18px;}
  h1{font-family:"Fraunces",Georgia,serif; font-weight:900; font-size:clamp(2rem,5.5vw,3.4rem);
    line-height:1.03; color:var(--ink); margin:0 0 .3em; letter-spacing:-0.02em;}
  .subline{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 16px; font-size:1.02rem;}
  .subline b{color:var(--ink); font-weight:600;}
  .count{font-family:"Fraunces",Georgia,serif; font-weight:600; color:var(--p2);}
  .count span{font-size:1.35rem; font-weight:900;}
  .editdate{background:none; border:none; color:var(--p1); font:inherit; font-size:.85rem; text-decoration:underline; cursor:pointer; padding:0;}

  .head-right{display:flex; align-items:center; gap:18px;}
  .gauge{width:104px; height:104px; border-radius:50%; flex-shrink:0;
    background:conic-gradient(var(--p6) calc(var(--pct,0)*1%), #E4E1D8 0);
    display:flex; align-items:center; justify-content:center; position:relative;}
  .gauge::before{content:""; position:absolute; width:82px; height:82px; border-radius:50%; background:var(--canvas);}
  .gauge .g-in{position:relative; text-align:center;}
  .gauge .g-in b{font-family:"Fraunces",Georgia,serif; font-size:1.6rem; color:var(--ink); line-height:1;}
  .gauge .g-in span{display:block; font-size:.58rem; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); margin-top:3px;}
  .breakdown{display:grid; gap:6px; font-size:.82rem;}
  .breakdown div{display:flex; align-items:center; gap:8px; white-space:nowrap;}
  .breakdown i{width:10px; height:10px; border-radius:3px; display:inline-block;}
  .breakdown b{color:var(--ink); font-variant-numeric:tabular-nums;}

  .toolbar{display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; padding-top:18px; border-top:1px solid var(--line);}
  .btn{font:inherit; font-weight:600; font-size:.9rem; border-radius:100px; padding:9px 18px; cursor:pointer; border:1px solid var(--line);}
  .btn-primary{background:var(--ink); color:#fff; border-color:var(--ink);}
  .btn-primary:hover{filter:brightness(1.15);}
  .btn-ghost{background:var(--canvas); color:var(--ink);}
  .btn-ghost:hover{border-color:var(--muted);}
  .hint{color:var(--muted); font-size:.8rem; margin-top:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .sync-dot{width:9px; height:9px; border-radius:50%; display:inline-block; background:var(--muted);}
  .sync-dot.live{background:var(--ok);}

  .ws{background:var(--canvas); border:1px solid var(--line); border-left:6px solid var(--pig);
    border-radius:4px; padding:18px clamp(14px,2.5vw,24px) 8px; margin:16px 0;}
  .ws-top{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 14px;}
  .ws-name{font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:1.22rem; color:var(--ink);}
  .ws-phase{font-size:.72rem; font-weight:600; color:var(--pig); border:1px solid currentColor; border-radius:100px; padding:2px 10px;}
  .ws-count{font-size:.78rem; color:var(--muted); margin-left:auto;}
  .ws-goal{color:var(--body); font-size:.92rem; margin:6px 0 12px; max-width:72ch;}

  /* inline-editable text affordance */
  .editable{cursor:text; border-radius:3px; transition:background .12s ease;}
  .editable:hover{background:#FBFAF7; box-shadow:0 0 0 1px var(--line);}
  .editable:focus{outline:none; background:#fff; box-shadow:0 0 0 2px rgba(47,69,197,.35);}

  .item{display:grid; grid-template-columns:1fr 140px 88px 138px 30px; gap:10px 14px;
    align-items:center; padding:12px 0; border-top:1px solid var(--line); cursor:pointer;}
  .item:hover{background:#FBFAF7;}
  .item .task{color:var(--ink); font-weight:500; font-size:.96rem;}
  .item .owner{color:var(--body); font-size:.86rem;}
  .item .owner .who{display:inline-block; background:var(--wall); border-radius:100px; padding:2px 10px; font-weight:600; color:#3c3746;}
  .item .owner .who.blank{background:transparent; border:1px dashed #C7C3D0; color:#B4AEC0; font-weight:500; font-size:.8rem;}
  .item .due{color:var(--body); font-size:.85rem; font-variant-numeric:tabular-nums;}
  .pill-select{font:inherit; font-size:.76rem; font-weight:700; padding:4px 10px; border-radius:100px; border:1px solid transparent; cursor:pointer; outline:none; width:100%;}
  .st-done{background:rgba(18,135,108,.13); color:var(--ok);}
  .st-prog{background:rgba(47,69,197,.13); color:var(--go);}
  .st-todo{background:rgba(139,133,152,.16); color:#6c6779;}
  .st-call{background:rgba(201,118,26,.16); color:var(--call);}
  .del{background:rgba(218,62,30,.10); color:var(--p2); border:none; width:26px; height:26px; border-radius:50%; font-size:15px; font-weight:700; cursor:pointer; line-height:1;}
  .del:hover{background:rgba(218,62,30,.22);}

  footer{margin-top:30px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted); font-size:.82rem;}

  .backdrop{position:fixed; inset:0; background:rgba(35,30,46,.45); display:none; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .sheet{background:var(--canvas); border-radius:10px; width:100%; max-width:520px; padding:24px; max-height:90vh; overflow-y:auto; box-shadow:0 18px 40px rgba(0,0,0,.28);}
  .sheet h3{font-family:"Fraunces",Georgia,serif; font-weight:600; color:var(--ink); font-size:1.35rem; margin:0 0 16px;}
  .fg{margin-bottom:13px;}
  .fg label{display:block; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin-bottom:5px;}
  .fg input,.fg select,.fg textarea{width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:7px; font:inherit; font-size:.92rem; outline:none; background:#FBFAF7; color:var(--ink);}
  .fg textarea{resize:vertical; min-height:64px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
  .modal-btns{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:20px;}
  .modal-btns .right{display:flex; gap:8px;}

  @media(max-width:640px){
    .head-right{width:100%; justify-content:flex-start;}
    .item{grid-template-columns:1fr auto; gap:6px 10px; grid-template-areas:"task del" "owner owner" "due due" "status status";}
    .item .task{grid-area:task;} .item .owner{grid-area:owner;} .item .due{grid-area:due;}
    .item .status{grid-area:status;} .item .del{grid-area:del; justify-self:end;}
    .item .owner::before{content:"Owner — "; color:var(--muted); font-weight:400;}
    .item .due::before{content:"Due — "; color:var(--muted);}
    .row2{grid-template-columns:1fr;}
  }
  @media print{ body{background:#fff;} .toolbar,.del,.backlink,.editdate{display:none;} .item{cursor:default;} .editable:hover{background:none; box-shadow:none;} }
</style>
</head>
<body>
<div class="wrap">

  <header class="placard">
    <a class="backlink" href="index.html">← War Room</a>
    <div class="head-grid">
      <div class="head-left">
        <span class="stamp">Cordovan Art School · Woodlands–Gosling Rd</span>
        <h1>Launch Marketing Plan</h1>
        <div class="subline">
          <span>Grand opening <b id="open-date">Oct 31, 2026</b></span>
          <button class="editdate" onclick="editDate()">edit date</button>
          <span class="count" id="count">—</span>
        </div>
      </div>
      <div class="head-right">
        <div class="gauge" id="gauge"><div class="g-in"><b id="pct">0%</b><span>Complete</span></div></div>
        <div class="breakdown" id="breakdown"></div>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn btn-primary" onclick="openAdd()">+ Add item</button>
      <button class="btn btn-ghost" onclick="window.print()">Print / save PDF</button>
      <button class="btn btn-ghost" onclick="resetAll()">Reset to default</button>
    </div>
    <p class="hint"><span class="sync-dot" id="sync-dot"></span><span id="sync-status">Local only</span> · Everything is editable — click a header, goal, item, or the date to change it.</p>
  </header>

  <main id="board"></main>

  <footer>
    Cordovan Art School — Woodlands–Gosling Rd · Prospera Experience Group LLC.
  </footer>
</div>

<div class="backdrop" id="modal">
  <div class="sheet">
    <h3 id="modal-title">Add item</h3>
    <div class="fg">
      <label>Workstream</label>
      <select id="f-ws"></select>
    </div>
    <div class="fg">
      <label>Task</label>
      <textarea id="f-task" placeholder="What needs to happen"></textarea>
    </div>
    <div class="row2">
      <div class="fg"><label>Owner</label><input id="f-owner" placeholder="Leave blank to assign later"></div>
      <div class="fg"><label>Due</label><input id="f-due" placeholder="e.g. Sep 22, Ongoing, —"></div>
    </div>
    <div class="fg">
      <label>Status</label>
      <select id="f-status"></select>
    </div>
    <div class="modal-btns">
      <button class="btn btn-ghost" id="modal-del" style="color:var(--p2);border-color:var(--p2);" onclick="delFromModal()">Delete</button>
      <div class="right">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveModal()">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
  /* ============================================================
     SHARED SYNC SETUP
     Paste your Firebase Realtime Database node URL below, ending
     in .json  — e.g.
     "https://cordovan-xxxx-default-rtdb.firebasedatabase.app/launchplan.json"
     Until you do, the plan saves locally in this browser only.
     ============================================================ */
  const SYNC_URL = "PASTE_YOUR_FIREBASE_URL_HERE";
  const SYNC_ON  = !SYNC_URL.includes("PASTE_YOUR");

  const STORE_KEY = 'cordovan_launch_plan_v1';
  const STATUSES = ['Not started','In progress','Done','Decide on call'];
  const STATUS_CLASS = {'Not started':'st-todo','In progress':'st-prog','Done':'st-done','Decide on call':'st-call'};
  const STATUS_DOT   = {'Not started':'var(--wait)','In progress':'var(--go)','Done':'var(--ok)','Decide on call':'var(--call)'};

  // key, colour and phase stay fixed; name + goal are editable and stored in data.ws
  const WS_DEFAULTS = [
    {key:'foundations',  pig:'--p1', phase:'Phase 1',           name:'Foundations & alignment',           goal:'One plan, one budget, one registration destination — everyone aligned before a dollar is spent.'},
    {key:'paid',         pig:'--p2', phase:'Phase 2',           name:'Paid social — Facebook & Instagram', goal:'Reach Spring/Woodlands parents with a clear offer and drive them to register.'},
    {key:'organic',      pig:'--p3', phase:'Phase 2',           name:'Organic social & community',        goal:'Build a local following for free, and seed the parent networks that convert.'},
    {key:'school',       pig:'--p4', phase:'Phase 2–3',         name:'School & local outreach',           goal:'Get in front of families where they already are — schools, PTAs, and neighbors.'},
    {key:'event',        pig:'--p5', phase:'Phase 3–4',         name:'Grand opening event · Oct 31',      goal:'Turn a Halloween opening into a can\u2019t-miss event that signs families up on the day.'},
    {key:'registration', pig:'--p6', phase:'Ongoing → Phase 4', name:'Registration & conversion',        goal:'Make sure all that awareness actually becomes enrolled students.'}
  ];

  const SEED = {
    openingDate: '2026-10-31',
    items: [
      {id:'m1', ws:'foundations', task:'Confirm the full pre-launch calendar & channel go-live dates', owner:'', due:'Sep 12', status:'Decide on call'},
      {id:'m2', ws:'foundations', task:'Lock total marketing budget & split across channels', owner:'', due:'Sep 12', status:'Decide on call'},
      {id:'m3', ws:'foundations', task:'Confirm Creative Tricycle\u2019s scope & what\u2019s already scheduled', owner:'', due:'Sep 12', status:'Decide on call'},
      {id:'m4', ws:'foundations', task:'Agree a single registration destination for every link', owner:'', due:'Sep 12', status:'Decide on call'},
      {id:'m5', ws:'foundations', task:'Set up lead tracking by source, so we know what\u2019s working', owner:'', due:'Sep 19', status:'Not started'},
      {id:'m6', ws:'foundations', task:'Set the weekly marketing check-in through opening', owner:'', due:'Sep 12', status:'Decide on call'},

      {id:'m7',  ws:'paid', task:'Confirm ad budget & geo-radius around Gosling Rd', owner:'', due:'Sep 19', status:'Decide on call'},
      {id:'m8',  ws:'paid', task:'Define audience — parents of kids ~5–14, Spring/Woodlands', owner:'', due:'Sep 22', status:'Not started'},
      {id:'m9',  ws:'paid', task:'Produce creative: launch, free trial, grand opening', owner:'', due:'Sep 26', status:'Not started'},
      {id:'m10', ws:'paid', task:'Finalize the founding-family / early-bird offer to feature', owner:'', due:'Sep 22', status:'Decide on call'},
      {id:'m11', ws:'paid', task:'Campaigns live', owner:'', due:'Sep 29', status:'Not started'},
      {id:'m12', ws:'paid', task:'Mid-flight review & optimize spend', owner:'', due:'Oct 13', status:'Not started'},

      {id:'m13', ws:'organic', task:'Content calendar Sep→Oct (build-out, teachers, countdown)', owner:'', due:'Sep 22', status:'Not started'},
      {id:'m14', ws:'organic', task:'Post 3–4× / week on studio Facebook & Instagram', owner:'', due:'Ongoing', status:'Not started'},
      {id:'m15', ws:'organic', task:'Seed local parent / mom Facebook groups & Nextdoor', owner:'', due:'Sep 26', status:'Not started'},
      {id:'m16', ws:'organic', task:'Collect build-out & class photos for content', owner:'', due:'Sep 19', status:'In progress'},
      {id:'m17', ws:'organic', task:'Verify Google Business Profile & Yelp — live and consistent', owner:'', due:'—', status:'Done'},

      {id:'m18', ws:'school', task:'Build target list of nearby schools & PTAs', owner:'', due:'Sep 19', status:'Not started'},
      {id:'m19', ws:'school', task:'Request HQ\u2019s approved school-outreach / flyer kit', owner:'', due:'Sep 15', status:'Not started'},
      {id:'m20', ws:'school', task:'Flyer drop + teacher referral cards to schools', owner:'', due:'Sep 29', status:'Not started'},
      {id:'m21', ws:'school', task:'Line up a spirit-night / PTA partnership', owner:'', due:'Oct 6', status:'Not started'},
      {id:'m22', ws:'school', task:'Cross-promo with neighboring businesses in the plaza', owner:'', due:'Oct 6', status:'Not started'},

      {id:'m23', ws:'event', task:'Decide event format — Halloween open house + free trial class', owner:'', due:'Sep 19', status:'Decide on call'},
      {id:'m24', ws:'event', task:'Confirm ribbon cutting (chamber / HQ)', owner:'', due:'Oct 3', status:'Not started'},
      {id:'m25', ws:'event', task:'Build the RSVP / event registration mechanism', owner:'', due:'Oct 6', status:'Not started'},
      {id:'m26', ws:'event', task:'Promote the event across every channel', owner:'', due:'Oct 10', status:'Not started'},
      {id:'m27', ws:'event', task:'Day-of run sheet: sign-up station, giveaways, kids\u2019 activity', owner:'', due:'Oct 24', status:'Not started'},

      {id:'m28', ws:'registration', task:'Test the Jackrabbit registration flow end-to-end', owner:'', due:'Sep 19', status:'In progress'},
      {id:'m29', ws:'registration', task:'Woodlands–Gosling landing page live & linked everywhere', owner:'', due:'—', status:'Done'},
      {id:'m30', ws:'registration', task:'Follow-up plan for the 23 existing trial leads', owner:'', due:'Sep 15', status:'In progress'},
      {id:'m31', ws:'registration', task:'Finalize the trial-class → enrollment offer', owner:'', due:'Sep 22', status:'Decide on call'},
      {id:'m32', ws:'registration', task:'Weekly registrations report vs. opening-day target', owner:'', due:'Ongoing', status:'Not started'}
    ]
  };

  let data;
  let editingId = null;

  // make sure editable header/goal text exists for every workstream
  function ensureWs(){
    if(!data.ws) data.ws = {};
    WS_DEFAULTS.forEach(w => { if(!data.ws[w.key]) data.ws[w.key] = {name:w.name, goal:w.goal}; });
  }

  /* ---------- persistence (shared or local) ---------- */
  async function load(){
    if(SYNC_ON){
      try{
        const res = await fetch(SYNC_URL);
        const remote = await res.json();
        if(remote && remote.items){ data = remote; }
        else { data = JSON.parse(JSON.stringify(SEED)); ensureWs(); await save(); }
      }catch(e){
        const raw = localStorage.getItem(STORE_KEY);
        data = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(SEED));
      }
    } else {
      try{ const raw = localStorage.getItem(STORE_KEY); data = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(SEED)); }
      catch(e){ data = JSON.parse(JSON.stringify(SEED)); }
    }
    if(!data.items) data.items = [];
    if(!data.openingDate) data.openingDate = SEED.openingDate;
    ensureWs();
  }

  async function save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }catch(e){}
    if(SYNC_ON){
      try{ await fetch(SYNC_URL, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)}); }
      catch(e){}
    }
  }

  // pull the latest shared copy so everyone stays in sync
  async function pullRemote(){
    if(!SYNC_ON) return;
    if(document.getElementById('modal').style.display === 'flex') return;         // don't clobber an open edit
    if(document.activeElement && document.activeElement.tagName === 'SELECT') return;
    if(document.activeElement && document.activeElement.isContentEditable) return; // or a header/goal being typed
    try{
      const res = await fetch(SYNC_URL);
      const remote = await res.json();
      if(remote && remote.items && JSON.stringify(remote) !== JSON.stringify(data)){
        data = remote;
        if(!data.items) data.items = [];
        ensureWs();
        try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }catch(e){}
        paintDate(); render();
      }
    }catch(e){}
  }

  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function render(){
    const total = data.items.length || 1;
    const counts = {'Not started':0,'In progress':0,'Done':0,'Decide on call':0};
    data.items.forEach(i => { counts[i.status] = (counts[i.status]||0) + 1; });
    const pct = Math.round((counts['Done']/total)*100);
    document.getElementById('gauge').style.setProperty('--pct', pct);
    document.getElementById('pct').innerText = pct + '%';
    document.getElementById('breakdown').innerHTML = STATUSES.map(s =>
      `<div><i style="background:${STATUS_DOT[s]}"></i><b>${counts[s]||0}</b> ${s}</div>`).join('');

    const board = document.getElementById('board');
    board.innerHTML = WS_DEFAULTS.map(ws => {
      const meta = data.ws[ws.key] || {name:ws.name, goal:ws.goal};
      const items = data.items.filter(i => i.ws === ws.key);
      const done = items.filter(i => i.status==='Done').length;
      const rows = items.map(i => {
        const ownerHtml = i.owner && i.owner.trim()
          ? `<span class="who">${esc(i.owner)}</span>`
          : `<span class="who blank">assign</span>`;
        const opts = STATUSES.map(s => `<option ${s===i.status?'selected':''}>${s}</option>`).join('');
        return `<div class="item" onclick="openEdit('${i.id}')">
          <div class="task">${esc(i.task)}</div>
          <div class="owner">${ownerHtml}</div>
          <div class="due">${esc(i.due)||'—'}</div>
          <div class="status" onclick="event.stopPropagation()">
            <select class="pill-select ${STATUS_CLASS[i.status]}" onchange="setStatus('${i.id}',this.value)">${opts}</select>
          </div>
          <button class="del" title="Delete" onclick="event.stopPropagation();delItem('${i.id}')">×</button>
        </div>`;
      }).join('');
      return `<section class="ws" style="--pig:var(${ws.pig})">
        <div class="ws-top">
          <span class="ws-name editable" contenteditable="true" spellcheck="false"
            data-key="${ws.key}" data-field="name"
            onblur="editWs(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">${esc(meta.name)}</span>
          <span class="ws-phase">${ws.phase}</span>
          <span class="ws-count">${done}/${items.length} done</span>
        </div>
        <p class="ws-goal editable" contenteditable="true" spellcheck="false"
          data-key="${ws.key}" data-field="goal" onblur="editWs(this)">${esc(meta.goal)}</p>
        ${rows || '<p class="ws-goal" style="color:var(--muted)">No items yet — use “+ Add item”.</p>'}
      </section>`;
    }).join('');
  }

  // save an edited header name or goal
  function editWs(el){
    const key = el.dataset.key, field = el.dataset.field;
    if(!data.ws[key]) data.ws[key] = {};
    const val = el.innerText.replace(/\s+$/,'').trim();
    if(!val){ el.innerText = data.ws[key][field] || ''; return; }   // don't allow blank
    if(val === data.ws[key][field]) return;                          // no change
    data.ws[key][field] = val; save();
  }

  function setStatus(id, val){
    const it = data.items.find(x => x.id===id);
    if(it){ it.status = val; save(); render(); }
  }
  function delItem(id){
    const it = data.items.find(x => x.id===id);
    if(it && confirm('Delete this item?\n\n' + it.task)){
      data.items = data.items.filter(x => x.id!==id); save(); render();
    }
  }

  function fillStatusSelect(){
    document.getElementById('f-status').innerHTML = STATUSES.map(s => `<option>${s}</option>`).join('');
  }
  function fillWsSelect(){
    document.getElementById('f-ws').innerHTML = WS_DEFAULTS.map(w => {
      const nm = (data.ws && data.ws[w.key] && data.ws[w.key].name) ? data.ws[w.key].name : w.name;
      return `<option value="${w.key}">${esc(nm)}</option>`;
    }).join('');
  }
  function openAdd(){
    editingId = null;
    fillWsSelect();
    document.getElementById('modal-title').innerText = 'Add item';
    document.getElementById('modal-del').style.display = 'none';
    document.getElementById('f-ws').value = WS_DEFAULTS[0].key;
    document.getElementById('f-task').value = '';
    document.getElementById('f-owner').value = '';
    document.getElementById('f-due').value = '';
    document.getElementById('f-status').value = 'Not started';
    document.getElementById('modal').style.display = 'flex';
  }
  function openEdit(id){
    const it = data.items.find(x => x.id===id); if(!it) return;
    editingId = id;
    fillWsSelect();
    document.getElementById('modal-title').innerText = 'Edit item';
    document.getElementById('modal-del').style.display = 'inline-block';
    document.getElementById('f-ws').value = it.ws;
    document.getElementById('f-task').value = it.task;
    document.getElementById('f-owner').value = it.owner;
    document.getElementById('f-due').value = it.due;
    document.getElementById('f-status').value = it.status;
    document.getElementById('modal').style.display = 'flex';
  }
  function closeModal(){ document.getElementById('modal').style.display = 'none'; }
  function saveModal(){
    const task = document.getElementById('f-task').value.trim();
    if(!task){ alert('Please enter a task.'); return; }
    const rec = {
      ws: document.getElementById('f-ws').value,
      task: task,
      owner: document.getElementById('f-owner').value.trim(),
      due: document.getElementById('f-due').value.trim() || '—',
      status: document.getElementById('f-status').value
    };
    if(editingId){
      const it = data.items.find(x => x.id===editingId);
      Object.assign(it, rec);
    } else {
      rec.id = 'm' + Date.now().toString(36) + Math.floor(Math.random()*1000);
      data.items.push(rec);
    }
    save(); render(); closeModal();
  }
  function delFromModal(){ if(editingId){ const id = editingId; closeModal(); delItem(id); } }

  function editDate(){
    const cur = data.openingDate || '2026-10-31';
    const v = prompt('Grand opening date (YYYY-MM-DD):', cur);
    if(v && !isNaN(Date.parse(v))){ data.openingDate = v; save(); paintDate(); }
  }
  function paintDate(){
    const d = new Date(data.openingDate + 'T00:00:00');
    document.getElementById('open-date').innerText = d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    const now = new Date(); now.setHours(0,0,0,0);
    const days = Math.round((d - now)/86400000);
    const el = document.getElementById('count');
    if(days > 0) el.innerHTML = '· <span>'+days+'</span> days to opening';
    else if(days === 0) el.innerHTML = '· <span>Opening day</span>';
    else el.innerHTML = '· <span>Open</span> — now growing';
  }

  function resetAll(){
    if(confirm('Reset the whole plan back to the original items and headers? This clears everyone\u2019s changes.')){
      data = JSON.parse(JSON.stringify(SEED)); ensureWs(); save(); paintDate(); render();
    }
  }

  function paintSyncStatus(){
    const dot = document.getElementById('sync-dot');
    const txt = document.getElementById('sync-status');
    if(SYNC_ON){ dot.classList.add('live'); txt.innerText = 'Synced live — the whole team shares one copy'; }
    else { dot.classList.remove('live'); txt.innerText = 'Local only — add your Firebase URL to share'; }
  }

  document.getElementById('modal').addEventListener('click', e => { if(e.target.id==='modal') closeModal(); });

  /* ---------- init ---------- */
  (async function(){
    fillStatusSelect();
    paintSyncStatus();
    await load();
    paintDate();
    render();
    if(SYNC_ON) setInterval(pullRemote, 8000);
  })();
</script>
</body>
</html>
